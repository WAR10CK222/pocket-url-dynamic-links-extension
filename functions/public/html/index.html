    <meta name="twitter:app:url:googleplay" content="https://play.google.com/store/apps/details?id={{androidBundleID}}">

    <style>
        body {
            padding: 0;
            margin: 0;
            background-color: black;
            background-size: cover;
            background-image: url('{{backgroundImage}}');
        }

        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* width: 200px; */
        }

        #no-app-install {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
        }

        #open-url {
            background-color: #eb4547;
            border-radius: 7px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 5rem;
            height: 3.5rem;
            width: 240px;
        }
    </style>
</head>

<body>
    <img id="status" src="{{statusImage}}" />
    <div id="no-app-install" style="display: none;">
        <p id="info-text" style="text-align: center; color: white; font-size: 1rem;">
            Oops! It looks like you don't have {{sitename}} App installed.
        </p>
        <button id="open-url"></button>
    </div>
</body>

<script>
    const customButtonDiv = document.getElementById('no-app-install');
    const customButton = document.getElementById('open-url');
    const statusImage = document.getElementById('status');

    if ('{{redirectToStore}}' == 'true') {
        if ('{{osfamily}}' === 'iOS') {
            window.location.href = 'https://{{hostname}}{{appredirect}}?forceRedirectionToStore=true&platform={{osfamily}}&link=https://apps.apple.com/app/id{{appStoreID}}';
        } else if ('{{osfamily}}'.includes('Android')) {
            if ('{{androidScheme}}' != 'false') {
                const fallbackUrl = encodeURIComponent(
                    'https://play.google.com/store/apps/details?id={{androidBundleID}}',
                );
                window.location.href = `intent://{{hostname}}{{appredirect}}#Intent;action=android.intent.action.VIEW;category=android.intent.category.DEFAULT;scheme={{androidScheme}};package={{androidBundleID}};S.browser_fallback_url=${fallbackUrl};end`;
            } else {
                window.location.href =
                    'https://play.google.com/store/apps/details?id={{androidBundleID}}';
            }
        } else {
            if ('{{redirectUrl}}' != '') {
                window.location.href = '{{redirectUrl}}';
            }
        }
    } else if ('{{redirectUrl}}' != '') {
        window.location.href = '{{redirectUrl}}';
    }
</script>
