<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="white">
    <meta name="apple-itunes-app" content="app-id={{iosItunesID}}, app-argument=https://{{hostname}}{{appredirect}}">

    <link rel="icon" type="image/png" href="{{favicon}}">
    <link rel="mask-icon" href="{{maskicon}}" color="#e63f41">

    <title>Link not Found</title>
    <meta name="description" content="Requested link was not found.">

    <link rel="apple-touch-icon" sizes="180x180" href="{{appletouchicon}}">

    <style>
        body {
            padding: 0;
            margin: 0;
            background-color: black;
            background-size: cover;
            background-image: url("{{backgroundImage}}");
        }

        #link-powered {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
        }

        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* width: 180px; */
        }
    </style>
</head>

<body>
    <img id="status" src="{{notFoundImage}}" alt="Not Found" />
</body>

</html>
