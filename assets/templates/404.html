<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="{{themeColor}}">
    <meta name="robots" content="noindex">
    <title>Link not found · {{siteName}}</title>
    <meta name="description" content="The requested link was not found or has expired.">
    <link rel="icon" href="{{favicon}}">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000 url("{{backgroundImage}}") center / cover no-repeat;
            color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 24px;
            text-align: center;
        }

        a {
            color: #fff;
        }
    </style>
</head>

<body>
    <main>
        <img src="{{notFoundImage}}" alt="Link not found" width="220">
        <p>This link doesn't exist or has expired.</p>
        <a href="{{siteUrl}}">Go to {{siteName}}</a>
    </main>
</body>

</html>
