# Learn detailed information about the fields of an extension.yaml file in the docs:
# https://firebase.google.com/docs/extensions/reference/extension-yaml

# Identifier for your extension
# TODO: Replace this with an descriptive name for your extension.
name: pocket-url
version: 0.0.1 # Follow semver versioning
specVersion: v1beta # Version of the Firebase Extensions specification
icon: icon.ico
tags: ["shortlinks", "dynamiclinks", "bitly", "analytics"]

# Friendly display name for your extension (~3-5 words)
displayName: Pocket URL ( Bitly Free Alternative. )

# Brief description of the task your extension performs (~1 sentence)
description: >-
  Bitly Free Alternative. Make as many, Serve as many. Get insights and Dashboard to monitor your links.

license: Apache-2.0 # https://spdx.org/licenses/

author:
  authorName: Shubham Patel
  email: shubhvinpatel98@gmail.com
  url: https://solvemybizz.org

# Public URL for the source code of your extension.
# TODO:  Replace this with your GitHub repo.
sourceUrl: https://github.com/WAR10CK222/pocket-url-dynamic-links-extension.git

# Specify whether a paid-tier billing plan is required to use your extension.
# Learn more in the docs: https://firebase.google.com/docs/extensions/reference/extension-yaml#billing-required-field
billingRequired: true

# In an `apis` field, list any Google APIs (like Cloud Translation, BigQuery, etc.)
# required for your extension to operate.
# Learn more in the docs:
# https://firebase.google.com/docs/extensions/reference/extension-yaml#apis-field

# In a `roles` field, list any IAM access roles required for your extension to operate.
# Learn more in the docs:
# https://firebase.google.com/docs/extensions/reference/extension-yaml#roles-field
roles:
  - role: firebasehosting.admin
    reason: Required to create a hosting site and serve static files

  - role: firebasedatabase.admin
    reason: Required to write to analytics and logs to realtime database

# In the `resources` field, list each of your extension's functions, including the trigger for each function.
# Learn more in the docs:
# https://firebase.google.com/docs/extensions/reference/extension-yaml#resources-field
resources:
  - name: shareHandler
    type: firebaseextensions.v1beta.function
    description: >-
      HTTP request-triggered function that redirects to specified url
    properties:
      # httpsTrigger is used for an HTTP triggered function.
      httpsTrigger: {}
      runtime: "nodejs22"

# lifecycleEvents:
#   onInstall:
#     function: setuphosting
#     processingMessage: Running initial setup and assigning resources

# In the `params` field, set up your extension's user-configured parameters.
# Learn more in the docs:
# https://firebase.google.com/docs/extensions/reference/extension-yaml#params-field
params:
  - param: HOSTNAME
    label: Hostname
    description: The hostname for your site (e.g., example.com).
    type: string
    required: true

  - param: SITENAME
    label: Site Name
    description: The display name of your site.
    type: string
    required: true

  - param: SITEURL
    label: Site URL
    description: The full URL of your site (e.g., https://example.com).
    type: string
    required: true

  - param: SITEICON
    label: Site Icon URL
    description: URL to the site icon image.
    type: string
    required: false

  - param: SITEKEYWORDS
    label: Site Keywords
    description: Comma-separated keywords for your site.
    type: string
    required: true

  - param: DYNAMICLINKDOMAIN
    label: Dynamic Link Domain
    description: (Optional) Custom dynamic link domain.
    type: string
    required: false

  - param: TWITTERHANDLE
    label: Twitter Handle
    description: (Optional) Twitter handle for your site (without @).
    type: string
    required: false

  - param: IOSAPP
    label: iOS App Available?
    description: True if you have iOS application
    type: select
    default: false

  - param: IOSBUNDLEID
    label: iOS Bundle ID
    description: (Optional) iOS application bundle identifier.
    type: string
    required: false

  - param: IOSTEAMID
    label: iOS Team ID
    description: (Optional) Apple Developer Team ID for iOS app.
    type: string
    required: false

  - param: IOSITUNESID
    label: iOS iTunes ID
    description: (Optional) iTunes ID for your iOS app.
    type: string
    required: false

  - param: ANDROIDAPP
    label: Android App Available?
    description: True if you have Android application
    type: string
    default: false

  - param: ANDROIDBUNDLEID
    label: Android Bundle ID
    description: (Optional) Android application bundle identifier.
    type: string
    required: false

  - param: ANDROIDSHA
    label: Android SHA
    description: (Optional) SHA certificate fingerprint for Android app.
    type: string
    required: false

  - param: ANDROIDSCHEME
    label: Android Scheme
    description: (Optional) Custom scheme for your Android app.
    type: string
    required: false
